name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Docker is available for integration tests
        run: docker info

      - name: Test, analyze and package
        run: ./gradlew --no-daemon --stacktrace clean check bootJar

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: financeconsultante
          path: build/libs/*-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

      - name: Build deployment image
        run: docker build --tag financeconsultante:${{ github.sha }} .
