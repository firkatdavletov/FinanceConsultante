spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:financeconsultante}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:financeconsultante}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD}}

app:
  exchange-rates:
    enabled: ${EXCHANGE_RATES_ENABLED:false}
    access-key: ${CURRENCYLAYER_ACCESS_KEY:}
    base-url: ${CURRENCYLAYER_BASE_URL:https://api.currencylayer.com}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
  openai:
    enabled: ${OPENAI_ENABLED:false}
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
