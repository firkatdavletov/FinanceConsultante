spring:
  application:
    name: FinanceConsultante
  lifecycle:
    timeout-per-shutdown-phase: 45s
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-components: never
      show-details: never
      group:
        readiness:
          include: "readinessState,db"
    prometheus:
      access: read-only
  metrics:
    tags:
      application: ${spring.application.name}

app:
  firebase-auth:
    enabled: ${FIREBASE_AUTH_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
  mobile-api:
    enabled: false
    token: ${MOBILE_API_TOKEN:}
    telegram-user-id: ${MOBILE_API_TELEGRAM_USER_ID:0}
  operations:
    metrics-enabled: true
  recurring:
    scheduler-enabled: true
    initial-delay: 5s
    poll-delay: 1h
    analysis:
      minimum-occurrences: 3
      lookback-days: 400
      weekly-interval-days: 7
      weekly-tolerance-days: 1
      monthly-interval-days: 30
      monthly-tolerance-days: 4
      amount-tolerance-percent: 20
      price-increase-percent: 5
      allowed-skipped-periods: 1
  exchange-rates:
    enabled: false
  telegram:
    enabled: false
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    owner-id: ${TELEGRAM_OWNER_ID:0}
  openai:
    enabled: false
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini-2024-07-18}
    request-timeout: ${OPENAI_REQUEST_TIMEOUT:10s}
    max-retries: ${OPENAI_MAX_RETRIES:1}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:256}
    daily-request-limit: ${OPENAI_DAILY_REQUEST_LIMIT:50}
    lease-duration: 2m
    poll-delay: 1s
  notifications:
    enabled: false
    initial-delay: 5s
    poll-delay: 1m
    lease-duration: 2m
    retry-delay: 30s
