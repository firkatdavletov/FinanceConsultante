spring:
  application:
    name: FinanceConsultante
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

app:
  exchange-rates:
    enabled: false
  telegram:
    enabled: false
  openai:
    enabled: false
  notifications:
    enabled: false
