spring:
  application:
    name: FinanceConsultante
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

app:
  recurring:
    scheduler-enabled: true
    initial-delay: 5s
    poll-delay: 1h
  exchange-rates:
    enabled: false
  telegram:
    enabled: false
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    owner-id: ${TELEGRAM_OWNER_ID:0}
  openai:
    enabled: false
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini-2024-07-18}
    request-timeout: ${OPENAI_REQUEST_TIMEOUT:10s}
    max-retries: ${OPENAI_MAX_RETRIES:1}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:256}
    daily-request-limit: ${OPENAI_DAILY_REQUEST_LIMIT:50}
    lease-duration: 2m
    poll-delay: 1s
  notifications:
    enabled: false
    initial-delay: 5s
    poll-delay: 1m
    lease-duration: 2m
    retry-delay: 30s
